name: Build APK

# main/master dallarına push başına tek otomatik derleme.
on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

# Aynı dalda yeni bir çalışma başlatılırsa önceki çalışma iptal edilir.
concurrency:
  group: gumus-takip-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "ERROR: Android sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi

          # Use a finite here-document rather than `yes | sdkmanager`.
          # `yes` gets SIGPIPE after sdkmanager exits and can fail the step even
          # when sdkmanager has already accepted every license.
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses <<'LICENSES'
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          LICENSES

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GumusTakip-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
