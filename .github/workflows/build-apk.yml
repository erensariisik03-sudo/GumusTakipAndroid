name: Build APK

# Her main/master push'unda tek otomatik derleme.
# workflow_dispatch kaldırıldı; böylece commit sonrası ayrıca elle başlatıp
# aynı proje için ikinci bir workflow çalıştırılmaz.
on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

# Aynı dal için yeni bir derleme başlarsa eski çalışmayı iptal et.
concurrency:
  group: gumus-takip-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 kaldırıldı. Paylaşılan günlükte bu
      # action, artık bulunmayan "tools" SDK paketini kurmaya çalışıp duruyordu.
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "HATA: Android sdkmanager bulunamadı: $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GumusTakip-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
